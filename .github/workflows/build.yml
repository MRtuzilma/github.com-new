name: APK yig'ish

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: APK yig'ish
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk AvtoLauncher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AvtoLauncher-apk
          path: AvtoLauncher.apk
      - name: Release (yuklab olish havolasi)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v5.4.${{ github.run_number }}" AvtoLauncher.apk --title "Avto Launcher v5.4.${{ github.run_number }}" --notes "Planshetga o'rnatish uchun AvtoLauncher.apk faylini yuklab oling." --latest
