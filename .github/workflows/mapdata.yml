name: Xarita ma'lumotlari (O'zbekiston)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"   # har oyning 1-kuni — xarita yangilanadi, planshetlar internetdan o'zi oladi

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: OpenStreetMap'dan yuklab olish
        run: |
          mkdir -p app/src/main/assets
          python3 tools/build_map.py app/src/main/assets/uz_map.bin
          ls -la app/src/main/assets
      - name: Saqlash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/src/main/assets/uz_map.bin
          git commit -m "Oflayn xarita: O'zbekiston aholi punktlari va trassalar (OSM)" || echo "o'zgarish yo'q"
          git push
